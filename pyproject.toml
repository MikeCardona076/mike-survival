[project]
name = "mike-survival"
version = "0.1.0"
description = "Survival roguelite 2D donde el Operador coordina a Mike por radio."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "assets", "config", "db", "game", "ui"]

[tool.black]
target-version = ["py312"]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
